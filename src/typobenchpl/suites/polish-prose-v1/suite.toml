name = "polish-prose-v1"
version = "1.0.0"
description = "General Polish prose completion benchmark"
mode = "completion"
evaluation_scope = "prompt_and_completion"

[generation]
max_new_tokens = 80
do_sample = true
temperature = 0.7
top_k = 40
repetition_penalty = 1.3
seed = 42
prepend_bos = "auto"
