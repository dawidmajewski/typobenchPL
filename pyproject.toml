[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "typobenchpl"
version = "0.1.0"
description = "Deterministic surface-quality benchmark for Polish text"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
hf = [
    "torch>=2.6",
    "transformers>=5.0,<6",
]

[project.scripts]
typobenchpl = "typobenchpl.cli:entrypoint"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/typobenchpl"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
